[cli]
# The xboxrecomp-cli ./automodellista runs: the bootstrap clones it at this release
# tag (or commit) when it finds none; with both, the commit locks the tag.
# `automodellista pins refresh` prints the newest release.
tag = "v0.22.0"
commit = "a994f6aec0972346f65063bd2586398aad1e4b21"
url = "https://github.com/apexJCL/xboxrecomp-cli.git"

[toolkit]
# `automodellista setup` clones it into external/xboxrecomp at this commit. A
# release tag pins it too: tag = "..." (branch is then optional).
url = "https://github.com/apexJCL/xboxrecomp.git"
# Push round 20's public tag. It carries the lifter fix the port needs
# (narrow mul/imul/div/idiv keep their 8- and 16-bit registers; without
# it the menus scroll on their own), so no local toolkit is needed.
tag = "blinx2-v0.15.0"
branch = "blinx2/portability"
commit = "92f8954cac77fb95f11955ebd0b28b1267a31fdb"

[toolchain]
# The llvm-mingw release the windows target cross-compiles with, on every host.
llvm_mingw = "20260922"

[pipeline]
# Stamped into every generated file: fixed for the life of the game.
game_name = "Auto Modellista"
gen = "src/recomp/gen"
out = "analysis"
# Function starts the disassembler missed (ICALL failures at runtime).
seeds = ["config/seed_functions.json"]
# The toolkit's icall_feedback database belongs to another game: off.
icall_seeds = false
exclude_manual = "src/recomp_manual.c"

[pipeline.disasm]
# Every code section: without the XDK sections (D3D, DSOUND, XGRPH, ...)
# there are no function boundaries there, and their internal calls become
# stubs. A title whose XBE flags data sections executable sets
# text_only = true and names its code sections in extra_sections.
text_only = false

[build]
# The CMake target and file name: build-win/automodellista_recomp.exe
exe = "automodellista_recomp"
# windows builds on every host (llvm-mingw); macos builds on a Mac (Apple
# clang). Drop one to stop `build` offering it.
targets = ["windows", "macos"]
# The enhancements layer is built in, as for every game (render scale,
# filter, fullscreen, pacing; its defaults leave the game stock), with the
# APU's DSP JIT (the toolkit's default where it has an archive for the target).
stock_cmake = ["-DXBOXRECOMP_ENHANCE=ON", "-DXBOXRECOMP_APU_DSP=ON"]

# How much memory one generated-code compile job takes sets how many run
# at once. Unset, it is estimated (140 MiB per MB of the largest gen/
# file); after a build, `automodellista doctor` shows the measured peak on its
# `build jobs` line, and that figure goes here.
# [build.resources]
# gen_job_mib = 1200
# tool_mib = 1700        # the largest single pipeline tool (disasm)
# tool_step = "disasm"

[data]
game_files = "game_files"

# Packaging: a private bundle with your own dump inside, `automodellista
# package windows|steamos|macos`. See the CLI's docs/manifest.md, [package].
[package]
app = "AutoModellista"
product = "automodellista-recomp"
# Windows, the SteamOS-like Linux PC (both from the windows build) and the
# Mac.
targets = ["windows", "steamos", "macos"]
# The Homebrew formulae the macos target links, as BLiNX 1 and 2 and KUF:
# the toolkit links SDL3 directly; sdl2 stays for hosts whose SDL2 is
# sdl2-compat over SDL3.
brew = ["sdl2", "sdl3", "openssl", "libepoxy"]
content = "packaging"
templates = "packaging"
icon = "xbe"

# The public repo: `automodellista public init` once per clone, then each
# round `automodellista public export` and the push it prints; the private
# notes, the patterns and the rewrite rules stay out of it. See the CLI's
# docs/layout.md.
[public]
url = "git@github.com:apexJCL/automodellista-recomp.git"
author = "carlos <4037632+apexJCL@users.noreply.github.com>"

# The player build wizard (the CLI's docs/wizard.md): a windowed program
# that clones this repo at the release tag, checks the host, asks for the
# dump, a target and these options, and runs package. `./automodellista
# wizard build` makes its three downloads (automodellista-wizard-*) from
# this table at a tag, and .github/workflows/release-wizard.yml attaches
# them to the release.
[wizard]
repo = "https://github.com/apexJCL/automodellista-recomp.git"
targets = ["windows", "steamos", "macos"]
# No icon: the CLI's generic gamepad glyph, as BLiNX 1 and 2 and KUF. The
# game's art and the publishers' marks are not mine to publish; the
# bundle's own icon comes from the player's XBE ([package] icon).
# No [[wizard.fetch]] entries: the clone carries everything else the build
# needs, and the CLI fetches the toolkit, llvm-mingw and NSIS itself by
# the pins in [cli], [toolkit] and its setup-pins.json.

# The wizard's open-source credits (xboxrecomp-cli docs/wizard.md,
# Credits): this repo is mine, listed first, before the CLI's repos.
[[wizard.credit]]
name = "automodellista-recomp"
role = "this recompilation of Auto Modellista for PC and Mac"
license = "MIT"
url = "https://github.com/apexJCL/automodellista-recomp"
own = true

# Only the basic tweaks: everything else (filter, anisotropic filtering,
# pacing, the menu, the RAM cache, the HUD layer) is in
# config.default.toml, which the Options page points to.
[[wizard.option]]
key = "scale"
label = "Render scale"
hint = "Draws the game sharper on a big screen; needs a faster graphics card."
kind = "range"
# The toolkit's render.scale stops at 4 (SCALE_MAX in src/enhance/enhance.c).
min = 1
max = 4
default = 1
config = "render.scale"
labels = { "1" = "640×480, as on the Xbox", "2" = "1280×960", "3" = "1920×1440", "4" = "2560×1920, the sharpest" }

[[wizard.option]]
key = "fullscreen"
label = "Start fullscreen"
kind = "bool"
default = false
config = "present.fullscreen"

[mods]
# The 2D library's draw entries (design D2), hooked by src/hud_mod.c so the
# HUD layer can move each element: one command struct per call, drawn
# through Begin/SetVertexData4f/End. Then the HUD table's wrapper, the lap
# times' digit helper (config/hud.toml).
hook_functions = ["0x0010E180", "0x0010E1E0", "0x0010E210", "0x0010E270",
                  "0x0010E2A0", "0x0010E2D0", "0x0010E300", "0x0010E4B0",
                  "0x0010E540", "0x0010E690", "0x0010E6C0", "0x0010E6F0",
                  "0x00022B20"]
# Each returns its result in eax (the 2D entries a handle, the helper
# nothing) but the walk loses the x87 depth in the helpers they call.
no_st0 = ["0x0010E180", "0x0010E1E0", "0x0010E210", "0x0010E270",
          "0x0010E2A0", "0x0010E2D0", "0x0010E300", "0x0010E4B0",
          "0x0010E540", "0x0010E690", "0x0010E6C0", "0x0010E6F0",
          "0x00022B20"]

[hud]
# The hud mod's table (src/hud_mod.c embeds it) and its id, for hud-map.
table = "config/hud.toml"
mod = "hud"
