# game.toml: what xboxrecomp-cli needs to know about Auto Modellista. The CLI reads
# it on every command; every key and its default is in the CLI's
# docs/manifest.md. Written by `xbr new`; the CLI never writes it again.
schema = 1

[game]
name = "Auto Modellista"
slug = "automodellista"

[xbe]
path = "game_files/default.xbe"
# The certificate's title ID: `package` refuses a dump with another one.
title_id = 0x4343000E
# The known dump: the copy every run and the hand-written parts are made
# from.
sha256 = ["581b44ace4726240610ab506147fc4277f9f07ab478f314efb047fb3b5a59378"]
# The release it is, from the certificate (`automodellista fingerprint --toml`):
# a dump of another region or version is "another release" in every
# warning.
region = 0x7  # region-free
version = 2
title = "auto modellista"

# The sha256 of each section's raw bytes in the known dump, from
# `automodellista fingerprint --toml`, so another dump is judged by what it
# changes.
[xbe.sections]
".text" = "f22e1f4f05df200aae7f801a232a7ce4007fe6ba97e70fccd7662dffd17efc64"
"D3D" = "d913af1b383400922ec5654e1f40d9b71eb054c2b9cb1791fedd51fdeb0f3448"
"D3DX" = "aee526f8e03441cf30d9c04d666fc1fe3c01b7b2df532194a78a2128ed129b43"
"XGRPH" = "f9b3e1f66226082e081486fdd4c982a28986a0852b7b91644fa0f2eb143d2cee"
"DSOUND" = "39ea8c6bca332ba81a0a56ba507154e06f1dc961bd3339fc4a51081734fbb156"
"XNET" = "9d6a46518e386026d7d058225d3adc2965661a8a318da05566824977a20b8869"
"XONLINE" = "1a38983afccbd8f3a69d99099d4ded87ab3943e82fabaea4a6bd865c8ec5661a"
"PSGSFD00" = "6ab67a3d5763bf2e85ba025954faee868783e685e4dca70a5434d72dfe4cc8f1"
"PSGSFD_I" = "3793a868165e6c5359ceef577d778166df3382b5f3f4d17e1fe17ba3770e6d6d"
"PSGSFD_B" = "bc5189a3ca5308b2ee17ad1287a364c240e7d6626880ef66b90bccb68dfb20dd"
"PSGSFD_P" = "25c4dffb4c82e296a07afcb40963cbd2dd04aa5ced1c0d6fd8bbf0f431d63cc2"
"XPP" = "de9c99214ced7873ad3dbd7a970c1737b7ef961f45a99950158a8bb987b14034"
".rdata" = "98b698903c2acd27dc45b503ba2d0850104a345c6033550fbeb381859b21776a"
".data" = "3fe6d5c80ca285e386b7bf5d87d7adb0a5df29178a17a9c3851703ab4cbc73bf"
"DOLBY" = "f0a884e7a36c81d3f6e5254ea998ced15c326d5212f2dbc341c1afb3817c780d"
"XON_RD" = "c263babb7a8c3cb473ef0e77bcc51f5bcee64f2afb32412509fc6cd85f910bb4"
