schema: spec-driven

context: |
  Project: static recompilation of the original Xbox game Auto Modellista (title
  0x4343000E) into a native executable, built on the xboxrecomp toolkit and
  driven by xboxrecomp-cli (./automodellista).
  Layout: src/main.c is the host entry point; src/recomp_manual.c holds
  hand-written overrides; src/recomp/gen/ is generated by `automodellista analyze` and
  `automodellista recomp` and is never hand-edited (missed functions are seeded in
  config/seed_functions.json); game_files/ holds the user's own dump and is
  never committed.
  Constraints: no game data, frames, audio or saves are ever committed.
